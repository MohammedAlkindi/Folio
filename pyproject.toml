[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folio"
version = "0.1.0"
description = "Local document intelligence pipeline — semantic search and Q&A over your own files."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "watchdog>=4.0.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ollama = ["ollama>=0.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
folio = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
